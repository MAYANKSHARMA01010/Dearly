name: Dearly checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: dearly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: dearly_ci
          POSTGRES_PASSWORD: ci-disposable-only
          POSTGRES_DB: dearly_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dearly_ci -d dearly_ci"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://dearly_ci:ci-disposable-only@127.0.0.1:5432/dearly_ci
      AUTH_TEST_DATABASE_URL: postgresql://dearly_ci:ci-disposable-only@127.0.0.1:5432/dearly_ci
      NODE_ENV: test
      STORAGE_PROVIDER: local
      PG_DUMP_BIN: /usr/lib/postgresql/16/bin/pg_dump
      PG_RESTORE_BIN: /usr/lib/postgresql/16/bin/pg_restore
      DRILL_DATABASE_URL: postgresql://dearly_ci:ci-disposable-only@127.0.0.1:5432/dearly_ci
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Require a semantic version for runtime deployments
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.before != '0000000000000000000000000000000000000000'
        env:
          DEPLOY_BASE_SHA: ${{ github.event.before }}
        run: node scripts/release.mjs check-deploy "$DEPLOY_BASE_SHA"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install media validation tools
        run: sudo apt-get update && sudo apt-get install -y ffmpeg postgresql-client-16
      - run: node scripts/release.mjs check
      - run: node --test scripts/operations/*.test.mjs scripts/release/*.test.mjs
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm run check --prefix backend
      - run: npm run check --prefix frontend
      - run: npm run test:integration --prefix backend
      - run: npm run test:integration --prefix frontend
      - run: npm run test:backup-drill --prefix backend
      - name: Exercise compatible code rollback on disposable data
        env:
          ROLLBACK_DATABASE_URL: postgresql://dearly_ci:ci-disposable-only@127.0.0.1:5432/dearly_ci
          ROLLBACK_TAG: v1.5.0-rc.1
        run: node scripts/release/rollback-drill.mjs
      - name: Bundle iOS and Android without signing credentials
        working-directory: frontend
        env:
          NODE_ENV: production
        run: npx expo export --platform ios --platform android --output-dir /tmp/dearly-ci-export
      - name: Validate container definitions
        run: docker compose -f scripts/compose.release.yaml config --no-env-resolution --no-interpolate > /dev/null
